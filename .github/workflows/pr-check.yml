name: Code Quality & Build Check

on:
  pull_request:
    branches:
      - main # Vagy a védett ágad neve

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kód
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # A SonarQube-nak szüksége van a teljes git history-ra a vizsgálathoz

      - name: Node.js beállítása
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Függőségek telepítése (npm)
        run: npm ci

      - name: Tesztek futtatása lefedettség méréssel
        run: npm run test:coverage # LCOV riport: coverage/lcov.info

      - name: Next.js Build ellenőrzése
        run: npm run build

      - name: SonarQube Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }} # Ezt a tokent a GitHub repód Secrets beállításaiba kell elmentened
